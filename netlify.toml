[build]
  publish = "."
  command = "node -e \"console.log('Netlify build complete')\""

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin-app"
  to = "/admin-app/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
