<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="45%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#003459" />
    </linearGradient>
    <linearGradient id="dropHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00A8E8" />
    </linearGradient>
  </defs>

  <!-- Water & Mountain Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer wave circle -->
    <circle cx="27" cy="27" r="26" fill="#EBF8FF" stroke="#00A8E8" stroke-width="1.8" opacity="0.7"/>
    
    <!-- Mountain Peaks -->
    <polygon points="12,38 22,22 29,31 38,18 45,38" fill="url(#mountainGrad)" opacity="0.25" />
    <polyline points="12,38 22,22 29,31 38,18 45,38" fill="none" stroke="#0077B6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pure Water Droplet in Center -->
    <path d="M28 14 C28 14, 18 28, 18 35 C18 40.5 22.5 45 28 45 C33.5 45 38 40.5 38 35 C38 28, 28 14, 28 14 Z" fill="url(#aquaGrad)"/>
    <path d="M24 22 C24 22, 20 29, 20 34 C20 37 22 39 24 40 C22 37 22 33 23 29 Z" fill="url(#dropHighlight)"/>
    <circle cx="32" cy="30" r="1.8" fill="#FFFFFF" opacity="0.9" />
    <circle cx="30" cy="38" r="1.2" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(72, 14)">
    <!-- Small NBS prefix badge -->
    <text x="0" y="11" font-family="'Outfit', 'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="11" letter-spacing="2" fill="#00C49F">
      NBS
    </text>
    <!-- Main Name: AQUAVEDA -->
    <text x="0" y="32" font-family="'Outfit', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#003459">
      AQUA<tspan fill="#00A8E8">VEDA</tspan>
    </text>
    <!-- Tagline: PURE • SAFE • HEALTHY -->
    <text x="1" y="45" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="8" letter-spacing="2.2" fill="#567285">
      PURE • SAFE • HEALTHY
    </text>
  </g>
</svg>
