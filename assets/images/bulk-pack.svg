<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400">
  <defs>
    <linearGradient id="bulk_box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F6" />
      <stop offset="100%" stop-color="#D0E8F2" />
    </linearGradient>
    <linearGradient id="bulk_tape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="shadowBulk" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#003459" flood-opacity="0.18" />
    </filter>
  </defs>

  <ellipse cx="160" cy="375" rx="110" ry="16" fill="#003459" opacity="0.15" />

  <g filter="url(#shadowBulk)">
    <!-- Box Perspective Front -->
    <path d="M50 160 L160 210 L270 160 L160 115 Z" fill="#E2F1F8" stroke="#0077B6" stroke-width="1.5" />
    <!-- Left Face -->
    <path d="M50 160 L160 210 L160 345 L50 290 Z" fill="#BEE1F4" stroke="#0077B6" stroke-width="1.5" />
    <!-- Right Face -->
    <path d="M160 210 L270 160 L270 290 L160 345 Z" fill="#99D3F1" stroke="#0077B6" stroke-width="1.5" />

    <!-- Blue Branding Tape Across Box Top -->
    <path d="M105 137 L215 186 L215 195 L105 146 Z" fill="url(#bulk_tape)" opacity="0.85" />
    <path d="M160 210 L160 345 L152 340 L152 206 Z" fill="url(#bulk_tape)" opacity="0.85" />

    <!-- Isometric Bottles Standing Inside/Behind Box -->
    <!-- Bottle 1 left -->
    <g transform="translate(68, 70) scale(0.65)">
      <rect x="135" y="45" width="30" height="20" rx="3" fill="#00A8E8" />
      <path d="M136 71 L136 90 C136 105, 115 120, 115 135 L115 250 C115 260, 125 265, 135 265 L165 265 C175 265, 185 260, 185 250 L185 135 C185 120, 164 105, 164 90 L164 71 Z"
            fill="#C2ECF9" stroke="#74C0FC" stroke-width="2" />
      <rect x="115" y="150" width="70" height="40" fill="#0077B6" />
      <text x="150" y="175" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">NBS RAJ</text>
    </g>

    <!-- Bottle 2 center -->
    <g transform="translate(110, 48) scale(0.72)">
      <rect x="135" y="45" width="30" height="20" rx="3" fill="#00C49F" />
      <path d="M136 71 L136 90 C136 105, 115 120, 115 135 L115 250 C115 260, 125 265, 135 265 L165 265 C175 265, 185 260, 185 250 L185 135 C185 120, 164 105, 164 90 L164 71 Z"
            fill="#BEEAF7" stroke="#00A8E8" stroke-width="2" />
      <rect x="115" y="150" width="70" height="40" fill="#003459" />
      <text x="150" y="175" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">NBS RAJ</text>
    </g>

    <!-- Bottle 3 right -->
    <g transform="translate(155, 68) scale(0.65)">
      <rect x="135" y="45" width="30" height="20" rx="3" fill="#00A8E8" />
      <path d="M136 71 L136 90 C136 105, 115 120, 115 135 L115 250 C115 260, 125 265, 135 265 L165 265 C175 265, 185 260, 185 250 L185 135 C185 120, 164 105, 164 90 L164 71 Z"
            fill="#C2ECF9" stroke="#74C0FC" stroke-width="2" />
      <rect x="115" y="150" width="70" height="40" fill="#0077B6" />
      <text x="150" y="175" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">NBS RAJ</text>
    </g>

    <!-- Front Carton Stamp -->
    <g transform="translate(180, 220) rotate(-15)">
      <rect x="0" y="0" width="75" height="48" rx="6" fill="#FFFFFF" opacity="0.9" stroke="#003459" stroke-width="1.5" />
      <text x="37" y="17" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="9" fill="#003459" text-anchor="middle">NBS RAJ</text>
      <text x="37" y="30" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10" fill="#007EA7" text-anchor="middle">BULK PACK</text>
      <text x="37" y="42" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="6.5" fill="#5A7184" text-anchor="middle">EVENT / SUPPLY</text>
    </g>
  </g>

  <!-- Commercial Badge -->
  <g transform="translate(20, 70)">
    <circle cx="28" cy="28" r="26" fill="#003459" stroke="#ffffff" stroke-width="2" />
    <text x="28" y="23" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="800" fill="#00C49F" text-anchor="middle">CUSTOM</text>
    <text x="28" y="36" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">BULK</text>
  </g>
</svg>
