<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="p500_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2ECF9" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#EFF9FD" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#B2E3F7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8ED6F1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="p500_cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8" />
      <stop offset="50%" stop-color="#00C49F" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="p500_label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>
    <filter id="shadow500" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#003459" flood-opacity="0.16" />
    </filter>
  </defs>

  <ellipse cx="150" cy="370" rx="80" ry="14" fill="#003459" opacity="0.12" />

  <g filter="url(#shadow500)">
    <!-- Cap -->
    <rect x="135" y="45" width="30" height="20" rx="3" fill="url(#p500_cap)" />
    <line x1="135" y1="52" x2="165" y2="52" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" />
    <line x1="135" y1="57" x2="165" y2="57" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
    <rect x="131" y="65" width="38" height="6" rx="2" fill="#0077B6" />

    <!-- Sleek 500ml Body -->
    <path d="M136 71 L136 100 C136 122, 102 140, 102 165 L102 335 C102 352, 114 360, 130 360 L170 360 C186 360, 198 352, 198 335 L198 165 C198 140, 164 122, 164 100 L164 71 Z"
          fill="url(#p500_body)" stroke="#74C0FC" stroke-width="2" />

    <!-- Contour Rings -->
    <path d="M104 175 Q 150 184, 196 175" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M103 192 Q 150 200, 197 192" stroke="#74C0FC" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M103 315 Q 150 322, 197 315" stroke="#74C0FC" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Premium Label -->
    <path d="M102 208 C102 208, 150 214, 198 208 L198 290 C198 290, 150 296, 102 290 Z" fill="url(#p500_label)" />
    <circle cx="150" cy="235" r="15" fill="#FFFFFF" opacity="0.95" />
    <path d="M150 224 C150 224, 143 233, 143 238 C143 241.8, 146.1 245, 150 245 C153.9 245, 157 241.8, 157 238 C157 233, 150 224, 150 224 Z" fill="#00C49F" />
    <text x="150" y="263" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NBS RAJ</text>
    <text x="150" y="278" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" fill="#E0F7FA" text-anchor="middle" letter-spacing="1">500 ML</text>

    <!-- Glass reflections -->
    <path d="M109 130 L109 345" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M116 145 L116 195" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Pack Badge Overlay -->
  <g transform="translate(195, 60)">
    <circle cx="26" cy="26" r="25" fill="#0077B6" stroke="#ffffff" stroke-width="2" />
    <text x="26" y="21" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle">PACK OF</text>
    <text x="26" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#E0F7FA" text-anchor="middle">24+1</text>
  </g>
</svg>
